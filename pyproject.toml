[project]
name = "paper-archaeology"
version = "0.1.0"
description = "Tracing the lives of scientific papers across editions, languages, citations and time."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.35",
    "typer>=0.12.5",
    "rich>=13.8.1",
    "httpx>=0.27.2",
    "networkx>=3.3",
    "fastapi>=0.114.2",
    "uvicorn>=0.30.6",
    "jinja2>=3.1.4",
    "thefuzz>=0.22.1",
    "python-levenshtein>=0.25.1",
    "alembic>=1.13.2"
]

[project.scripts]
paper-archaeology = "paper_archaeology.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.3",
    "ruff>=0.6.5",
    "mypy>=1.11.2",
]

[tool.ruff]
line-length = 100
