<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Paper Archaeology{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        :root {
            --primary: #4f5b66;
            --font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Liberation Sans", Arial, sans-serif;
        }
        main { padding-top: 2rem; }
        .timeline { border-left: 2px solid #ccc; padding-left: 1rem; margin-left: 1rem; }
        .timeline-event { margin-bottom: 1rem; position: relative; }
        .timeline-event::before {
            content: '';
            position: absolute;
            left: -1.3rem;
            top: 0.2rem;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
        }
    </style>
</head>
<body>
    <nav class="container-fluid">
        <ul>
            <li><strong>Paper Archaeology</strong></li>
        </ul>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/discover">Discover</a></li>
            <li><a href="/about">About</a></li>
        </ul>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
